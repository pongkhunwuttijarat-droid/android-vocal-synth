<!DOCTYPE html>
<html lang="th">
<head><meta charset="utf-8"><title>moe wasm POC — burn/ndarray in the browser</title></head>
<body>
<pre id="out" style="font:12px ui-monospace,monospace;white-space:pre-wrap">running…</pre>
<script type="module">
// task-4 POC: run the REAL burn MoE acoustic forward inside wasm32, in the browser.
//
// * the model is a real burn NamedMpk checkpoint (test/poc/bigset/w9-2048-model-g0.mpk),
//   fetched from disk and loaded with NamedMpkBytesRecorder inside the wasm module
// * moe_train::baseline::ContextAcoustic.forward runs in wasm-ndarray (NO native fallback:
//   the runner checks that the wasm module really executed and that native/ and wasm agree)
// * the synthetic input is generated BY THE WASM MODULE (wasm_synth_ids / wasm_synth_feats),
//   so the browser and the native reference binary cannot drift apart
//
// Timing is real wall-clock time; the runner does NOT use --virtual-time-budget
// (it freezes performance.now()), it waits for the JSON this page POSTs to /__result.
const qs = new URLSearchParams(location.search);
const GLUE = qs.get("glue") || "/native/crates/moe-wasm/www/pkg/moe_wasm.js";
const MODEL = qs.get("model") || "/test/poc/bigset/w9-2048-model-g0.mpk";
const ROWS = (qs.get("rows") || "1,128,1024").split(",").map(Number).filter((x) => x > 0);
const R = { verdict: "FAIL", error: null, model: MODEL, glue: GLUE, wasmBytesOnDisk: null };
const out = document.getElementById("out");
const log = [];
const say = (m) => { log.push(String(m)); out.textContent = log.join("\n"); fetch("/__progress", { method: "POST", body: String(m) }).catch(() => {}); };
const round = (x) => (Number.isFinite(x) ? Math.round(x * 1000) / 1000 : null);
const t0 = performance.now();

async function sha256hex(buf) {
  const d = await crypto.subtle.digest("SHA-256", buf);
  return [...new Uint8Array(d)].map((b) => b.toString(16).padStart(2, "0")).join("");
}
function stats(f32) {
  let min = Infinity, max = -Infinity, sum = 0, sq = 0, nan = 0;
  const seen = new Set();
  for (let i = 0; i < f32.length; i++) {
    const v = f32[i];
    if (!Number.isFinite(v)) { nan++; continue; }
    if (v < min) min = v;
    if (v > max) max = v;
    sum += v; sq += v * v;
    if (seen.size < 64) seen.add(v);
  }
  const n = f32.length - nan;
  return { n: f32.length, min, max, mean: n ? sum / n : 0, rms: n ? Math.sqrt(sq / n) : 0, nonFinite: nan, distinct: seen.size, first8: Array.from(f32.slice(0, 8)) };
}
function maxAbsDiff(a, b) {
  let m = 0;
  for (let i = 0; i < a.length; i++) { const d = Math.abs(a[i] - b[i]); if (d > m) m = d; }
  return m;
}

try {
  // ---- 1. wasm-bindgen glue ------------------------------------------------
  let t = performance.now();
  const mod = await import(/* @vite-ignore */ GLUE);
  const init = mod.default;
  const { load_checkpoint, forward, wasm_memory_bytes, loaded_param_count, wasm_synth_ids, wasm_synth_feats, wasm_synth_ids_alt, wasm_synth_feats_alt } = mod;
  R.importMs = round(performance.now() - t);
  if (typeof init !== "function") throw new Error("glue has no default init export");

  // ---- 2. instantiate the wasm module --------------------------------------
  t = performance.now();
  await init();
  R.instantiateMs = round(performance.now() - t);
  R.memBytesAfterInit = wasm_memory_bytes();
  say("wasm instantiated: import " + R.importMs + " ms · init " + R.instantiateMs + " ms · linear memory " + R.memBytesAfterInit + " B");

  // ---- 3. fetch the real checkpoint ---------------------------------------
  t = performance.now();
  const resp = await fetch(MODEL);
  if (!resp.ok) throw new Error("fetch " + MODEL + " -> HTTP " + resp.status);
  const buf = await resp.arrayBuffer();
  R.fetchMs = round(performance.now() - t);
  R.modelBytes = buf.byteLength;
  R.modelSha256 = await sha256hex(buf);
  say("model fetched: " + R.modelBytes + " bytes in " + R.fetchMs + " ms · sha256 " + R.modelSha256.slice(0, 16) + "…");

  // ---- 4. load the checkpoint INTO wasm (NamedMpkBytesRecorder) ------------
  t = performance.now();
  load_checkpoint(new Uint8Array(buf));
  R.loadMs = round(performance.now() - t);
  R.memBytesAfterLoad = wasm_memory_bytes();
  R.paramCount = loaded_param_count();
  say("checkpoint loaded inside wasm: " + R.loadMs + " ms · linear memory " + R.memBytesAfterLoad +
      " B · parameter elements materialised in wasm: " + R.paramCount);

  // ---- 5. forward passes ---------------------------------------------------
  R.runs = []; R.determinism = []; R.sensitivity = [];
  for (const rows of ROWS) {
    const idsA = wasm_synth_ids(rows);
    const featsA = wasm_synth_feats(rows);
    const idsB = wasm_synth_ids_alt(rows);
    const featsB = wasm_synth_feats_alt(rows);
    t = performance.now();
    const melA = forward(idsA, featsA, rows);
    const msA = round(performance.now() - t);
    t = performance.now();
    const melA2 = forward(idsA, featsA, rows);
    const msA2 = round(performance.now() - t);
    t = performance.now();
    const melB = forward(idsB, featsB, rows);
    const msB = round(performance.now() - t);
    const s = stats(melA);
    const det = maxAbsDiff(melA, melA2);
    const sens = maxAbsDiff(melA, melB);
    R.runs.push(Object.assign({ label: "A", rows, ms: msA, msRepeat: msA2 }, s));
    R.runs.push(Object.assign({ label: "B", rows, ms: msB }, stats(melB)));
    R.determinism.push({ rows, maxDiff: det });
    R.sensitivity.push({ rows, maxDiff: sens });
    say("rows=" + rows + " · forward " + msA + " ms · mel[" + s.n + "] min " + round(s.min) + " max " + round(s.max) +
        " mean " + s.mean.toFixed(6) + " rms " + s.rms.toFixed(6) + " · nonFinite " + s.nonFinite + " · distinct " + s.distinct +
        " · repeat max|diff| " + det + " · input-B max|diff| " + sens.toFixed(6));
    R.memBytesAfterForward = wasm_memory_bytes();
  }

  // ---- 6. bookkeeping ------------------------------------------------------
  const runsA = R.runs.filter((r) => r.label === "A");
  const bad = [];
  if (!runsA.length) bad.push("no runs");
  for (const r of R.runs) {
    if (r.n !== r.rows * 128) bad.push("rows " + r.rows + ": mel len " + r.n + " != rows*128");
    if (r.nonFinite !== 0) bad.push("rows " + r.rows + " " + r.label + ": nonFinite " + r.nonFinite);
    if (!(r.distinct > 1)) bad.push("rows " + r.rows + " " + r.label + ": constant output");
    if (!(r.rms > 0)) bad.push("rows " + r.rows + " " + r.label + ": zero rms");
    if (!(r.ms >= 0)) bad.push("rows " + r.rows + " " + r.label + ": no timing");
  }
  for (const d of R.determinism) if (!(d.maxDiff === 0)) bad.push("rows " + d.rows + ": not deterministic (maxDiff " + d.maxDiff + ")");
  for (const s of R.sensitivity) if (!(s.maxDiff > 1e-4)) bad.push("rows " + s.rows + ": output ignores the input (maxDiff " + s.maxDiff + ")");
  if (R.memBytesAfterLoad <= 0) bad.push("linear memory not readable");
  if (!(R.paramCount > 0)) bad.push("load_checkpoint materialised no parameters (paramCount " + R.paramCount + ")");
  if (performance.memory) { R.jsHeapMB = Math.round(performance.memory.usedJSHeapSize / 1048576); R.jsHeapLimitMB = Math.round(performance.memory.jsHeapSizeLimit / 1048576); }
  R.totalMs = round(performance.now() - t0);
  R.verdict = bad.length ? "FAIL" : "PASS";
  R.error = bad.length ? bad.join("; ") : null;
} catch (e) {
  R.error = (e && (e.stack || e.message)) ? (e.stack || e.message) : String(e);
  R.totalMs = round(performance.now() - t0);
  say("EXCEPTION: " + R.error);
}

say("VERDICT " + R.verdict + (R.error ? " — " + R.error : ""));
await fetch("/__result", { method: "POST", body: JSON.stringify(R) }).catch(() => {});
</script>
</body>
</html>
