<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>bench-post</title></head>
<body><pre id="out">running…</pre>
<script type="module">
import init, { Engine, last_panic } from "./pkg/engine_wasm.js";
const report = [];
const say = (m) => { report.push(m); document.getElementById("out").textContent = report.join("\n"); };

try {
  const oto = await (await fetch("./fixture/oto.ini")).text();
  const tInit = performance.now();
  await init();
  say(`init: ${(performance.now() - tInit).toFixed(1)} ms`);

  const engine = new Engine();
  say(`fft backend: ${engine.fft_backend()}`);
  engine.set_voicebank("demo", "demo", "voice", new TextEncoder().encode(oto));
  let loaded = 0;
  const tLoad = performance.now();
  for (const key of engine.wav_keys().split("\n").filter(Boolean)) {
    const r = await fetch("./fixture/bank/" + key);
    if (!r.ok) continue;
    const wav = new Uint8Array(await r.arrayBuffer());
    const fr = await fetch("./fixture/bank/" + key.replace(/\.wav$/i, "_wav.frq"));
    if (fr.ok) engine.add_sample_with_frq(key, wav, new Uint8Array(await fr.arrayBuffer()));
    else engine.add_sample(key, wav);
    loaded++;
  }
  say(`load ${loaded} samples: ${(performance.now() - tLoad).toFixed(1)} ms`);

  for (const [label, file] of [["demo-song", "demo-song.ustx"], ["scale-demo", "scale-demo.ustx"]]) {
    const yaml = await (await fetch("./fixture/" + file)).text();
    engine.render_project(yaml, 0);              // warm-up
    const times = [];
    let pcm;
    for (let i = 0; i < 3; i++) {
      const t0 = performance.now();
      pcm = engine.render_project(yaml, 0);
      times.push(performance.now() - t0);
    }
    const audioSec = pcm.length / 44100;
    const best = Math.min(...times);
    say(`${label}: ${audioSec.toFixed(2)}s audio | best ${best.toFixed(0)} ms | ` +
        `${(audioSec / (best / 1000)).toFixed(1)}x realtime | runs ${times.map(t => t.toFixed(0)).join("/")} ms`);
  }
} catch (e) {
  let detail = "";
  try { detail = last_panic(); } catch {}
  say("FATAL " + e + (detail ? " :: " + detail : ""));
}
await fetch("/__result", { method: "POST", body: report.join("\n") });
</script></body></html>
