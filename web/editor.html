<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lilt — Editor (wasm)</title>
<style>
/* Flutter Lilt theme: keep the visual system while the renderer stays WASM/R1. */
:root{--bg:#111217;--bar:#17181f;--strip:#181a22;--timeline-bg:#101116;--line:#303441;--muted:#8e94a7;--text:#eef0f7;--primary:#a98cff;--key-pink:#7358e9;--sel:#fff;--card:#20232d;--cyan:#55d7de;--green:#7be3a8;--orange:#ffc16d;--purple:#a98cff;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.45 Inter,ui-sans-serif,system-ui,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{border:0;cursor:pointer;background:none}
button:disabled{opacity:.4;cursor:not-allowed}

#app{height:100vh;display:grid;grid-template-rows:56px 48px 1fr 28px 48px;grid-template-columns:64px 1fr}
.rail{grid-row:1/6;background:#15161d;border-right:1px solid var(--line);display:flex;align-items:center;flex-direction:column;padding:14px 8px;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#c1afff,var(--primary) 58%,var(--key-pink));display:grid;place-items:center;color:#17131f;font-weight:900;font-size:17px;margin-bottom:4px}
.rail button{width:48px;min-height:48px;padding:5px 2px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;color:#777d91;border-radius:10px;font-size:17px}
.rail button small{font-size:9px;line-height:1.1}
.rail button:disabled{cursor:default;opacity:.38}
.rail button.active,.rail button:hover:not(:disabled){background:#292536;color:var(--primary)}

.topbar{grid-column:2;background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:9px}
.crumb{display:flex;align-items:baseline;gap:8px;min-width:180px;font-size:12px;color:var(--muted)}
.crumb strong{font-size:14px;color:var(--text);font-weight:600}
.chip{border:1px solid #393d4d;border-radius:6px;background:#20232d;padding:4px 9px;font-size:11px;color:#aeb3c2}
.spacer{flex:1}
.tb-btn{width:32px;height:32px;border-radius:7px;color:#b6bbcc;font-size:14px}
.tb-btn:hover:not(:disabled){background:#252833}
.tb-btn.active{background:#292536;color:var(--primary)}
.btn{background:#20232d;border:1px solid #393d4d;padding:6px 12px;border-radius:7px;color:#cdd1df;font-size:12px}
.btn:hover:not(:disabled){background:#2a2d39}
.btn.primary{background:var(--primary);border:0;color:#17131f;font-weight:650}

.tools{grid-column:2;height:48px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 12px;background:var(--bar)}
.tools .sep{width:1px;height:20px;background:var(--line);margin:0 6px}
.tools label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.tool-label{width:auto;min-width:54px;padding:0 8px;display:flex;gap:6px;align-items:center;font-size:11px!important;border:1px solid transparent}
.tool-label.active{background:#292536;color:var(--primary);border-color:#453b65}
.tools input[type=range]{width:88px}
.tools select{background:#2b2b2b;border:1px solid #3a3a3a;border-radius:6px;padding:4px 6px;font-size:12px}

.main{grid-column:2;display:grid;grid-template-columns:236px minmax(0,1fr) 290px;min-height:0;background:#111217}
.left{background:#181a22;border-right:1px solid var(--line);padding:12px 10px;overflow:auto}
.right{background:#181a22;border-left:1px solid var(--line);padding:12px;overflow:auto}
.section-title{display:flex;justify-content:space-between;align-items:center;color:#b5b9c8;font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;margin:2px 2px 8px}
.section-title small{color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0}
.track{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;color:#bdc1ce;margin:2px 0;cursor:pointer}
.track.selected{background:#292536;color:#fff}
.track .swatch{width:8px;height:24px;border-radius:5px;background:var(--primary)}
.track .tname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{width:22px;height:20px;border-radius:5px;background:#252833;color:#9a9a9a;font-size:11px;line-height:1}
.mini:hover{background:#3a3a3a}
.minibtn{background:#20232d;border:1px solid #393d4d;border-radius:6px;padding:4px 7px;font-size:11px;color:#cdd1df}
.minibtn:hover{background:#3a3a3a}
.projbar{display:flex;gap:4px;flex-wrap:wrap;margin:0 2px 8px}
.proj{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;color:#bdc1ce;cursor:pointer;font-size:12px}
.proj:hover{background:#242433}
.proj.selected{background:#2a263a;color:#fff}
.proj .pname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj .pmeta{color:#7d8296;font-size:10px}
.proj .pdel{width:18px;height:18px;border-radius:4px;background:#2b2b2b;color:#9a9a9a;font-size:10px;line-height:1}

.rollwrap{position:relative;min-width:0;display:grid;grid-template-columns:60px 1fr}
#keys{border-right:1px solid var(--line);display:block}
#roll{display:block;touch-action:none}
.rollhost{position:relative;min-width:0;min-height:0}
.rollhost canvas{position:absolute;inset:0}
#keys{position:relative}

.field{display:flex;flex-direction:column;gap:3px;margin-bottom:10px}
.field label{font-size:11px;color:var(--muted)}
.field input{background:#20232d;border:1px solid #393d4d;border-radius:6px;padding:5px 7px;font-size:12px}
.muted{color:var(--muted)}
.small{font-size:11px}

.statusbar{grid-column:2;display:flex;align-items:center;gap:12px;padding:0 12px;border-top:1px solid var(--line);background:var(--bar);font-size:11px;color:var(--muted);overflow:hidden}
.statusbar #log{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,monospace}
.transport{grid-column:2;display:flex;align-items:center;gap:10px;padding:0 14px;border-top:1px solid var(--line);background:#181a22}
.transport .btn{min-width:40px}
.engine-status{display:flex;align-items:center;gap:7px;margin-left:auto;border:1px solid #393d4d;border-radius:999px;background:#20232d;padding:4px 10px;color:#c8c1e8;font-size:11px}
.engine-status i{width:7px;height:7px;border-radius:50%;background:#7be3a8;box-shadow:0 0 8px #7be3a877}
@media(max-width:1050px){.main{grid-template-columns:190px minmax(0,1fr) 240px}.right{padding:10px}}
@media(max-width:760px){
  #app{grid-template-columns:56px minmax(0,1fr)}
  .main{grid-template-columns:164px minmax(0,1fr)}
  .right{display:none}
  .rail{padding-left:4px;padding-right:4px}
  .crumb{min-width:0;flex:1}.crumb #trackCount,#noteCount{display:none}
  .topbar{gap:5px;padding:0 8px}.chip{padding:4px 6px}
  .tools{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
  .tools label{white-space:nowrap}.tools input[type=range]{width:70px}
  .left{padding:10px 7px}.projbar{gap:3px}.minibtn{padding:4px 5px}
  .rollwrap{grid-template-columns:42px minmax(0,1fr)}
}
@media(max-width:580px){
  #app{grid-template-columns:48px minmax(0,1fr);grid-template-rows:52px 46px minmax(0,1fr) 26px 46px}
  .rail{padding-top:9px;gap:7px}.logo{width:34px;height:34px}
  .rail button{width:40px;min-height:43px;font-size:15px}.rail button small{font-size:8px}
  .main{grid-template-columns:132px minmax(0,1fr)}
  .left{padding:8px 5px}.section-title{font-size:10px;margin-bottom:6px}.section-title small{font-size:9px}
  .projbar .minibtn{font-size:9px;padding:4px 4px}.projbar{margin-left:0;margin-right:0}
  .track{padding:6px 4px;gap:4px;font-size:11px}.mini{width:17px}
  .rollwrap{grid-template-columns:34px minmax(0,1fr)}
  .topbar .chip#meterChip{display:none}.topbar{padding:0 6px}.crumb strong{font-size:12px}
  .transport{padding:0 7px;gap:6px}.engine-status{padding:4px 7px;font-size:9px}
  .transport .muted{display:none}
}
</style>
</head>
<body>
<div id="app">
  <div class="rail">
    <div class="logo">L</div>
    <button class="active" title="Editor" aria-current="page"><span>✎</span><small>Editor</small></button>
    <button title="Voicebanks" disabled><span>♪</span><small>Voices</small></button>
    <button title="Projects" onclick="document.getElementById('projNew').focus()"><span>▤</span><small>Projects</small></button>
    <button title="Settings" disabled><span>⚙</span><small>Settings</small></button>
  </div>

  <div class="topbar">
    <div class="crumb"><strong id="crumbName">—</strong><span id="trackCount"></span></div>
    <span class="chip" id="bpmChip">—</span>
    <span class="chip" id="meterChip">—</span>
    <span class="chip" id="noteCount"></span>
    <div class="spacer"></div>
    <button class="tb-btn" id="saveBtn" title="Save project">▣</button>
    <button class="tb-btn" id="undoBtn" title="Undo">↺</button>
    <button class="tb-btn" id="redoBtn" title="Redo">↻</button>
    <button class="btn" id="renderBtn">Render</button>
  </div>

  <div class="tools">
    <button class="tb-btn tool-label active" id="toolSelect" title="Select / View"><span>⌖</span><span>Select</span></button>
    <button class="tb-btn tool-label" id="toolDraw" title="Draw note"><span>✎</span><span>Draw</span></button>
    <button class="tb-btn tool-label" id="toolSplit" title="Split note"><span>✂</span><span>Split</span></button>
    <button class="tb-btn tool-label" id="toolErase" title="Erase note"><span>⌫</span><span>Erase</span></button>
    <div class="sep"></div>
    <label>Snap
      <select id="snapSel">
        <option value="4">1/4</option>
        <option value="8">1/8</option>
        <option value="16">1/16</option>
        <option value="off">off</option>
      </select>
    </label>
    <div class="sep"></div>
    <label>X<input type="range" id="zoomX" min="24" max="420" value="96"></label>
    <label>Y<input type="range" id="zoomY" min="8" max="42" value="18"></label>
    <div class="sep"></div>
    <button class="tb-btn" id="fxBtn" title="Chunk overlay">⚡</button>
    <span class="muted small">R1 · WASM</span>
  </div>

  <div class="main">
    <div class="left">
      <div class="section-title">Projects <small id="projectState"></small></div>
      <div class="projbar">
        <button class="minibtn" id="projNew" title="โปรเจกต์ใหม่">New</button>
        <button class="minibtn" id="projSaveAs" title="บันทึกเป็นชื่อใหม่">Save as</button>
        <button class="minibtn" id="projExport" title="ดาวน์โหลด .ustx">Export</button>
        <button class="minibtn" id="projImport" title="เปิดไฟล์ .ustx">Import</button>
        <input type="file" id="projFile" accept=".ustx,text/plain" hidden>
      </div>
      <div id="projectList"></div>
      <div class="section-title" style="margin-top:14px">Tracks <small id="chunkInfo"></small></div>
      <div id="trackList"></div>
    </div>

    <div class="rollwrap">
      <canvas id="keys"></canvas>
      <div class="rollhost"><canvas id="roll"></canvas></div>
    </div>

    <div class="right">
      <div class="section-title">Inspector</div>
      <div id="inspector"></div>
    </div>
  </div>

  <div class="statusbar">
    <span id="status">กำลังโหลด…</span>
    <span id="log"></span>
  </div>

  <div class="transport">
    <button class="btn primary" id="playBtn">▶</button>
    <button class="btn" id="stopBtn" title="หยุดเล่น + ยกเลิก render">⏹</button>
    <span class="muted small">พร้อมทดลอง · Browser renderer</span>
    <span class="engine-status"><i></i>WORLDLINE-R · R1/WASM</span>
    <select id="renderEngine" aria-label="Render engine" hidden>
      <option value="r1-rs" selected>R1 · Rust/WASM</option>
    </select>
  </div>
</div>

<script type="module">
import { Editor } from "./app/editor.js";
const ed = new Editor();
window.__editor = ed; // for headless tests
ed.boot().catch((e) => {
  document.getElementById("status").textContent = "โหลดไม่สำเร็จ";
  document.getElementById("log").textContent = String(e && e.stack ? e.stack : e);
  console.error(e);
});
</script>
</body>
</html>
