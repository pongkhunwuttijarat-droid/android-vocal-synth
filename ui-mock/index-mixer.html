<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lilt — Mixer UI Mock</title>
<style>
:root{--bg:#111217;--panel:#181a22;--panel2:#20232d;--line:#303441;--muted:#8e94a7;--text:#eef0f7;--purple:#a98cff;--purple2:#7358e9;--cyan:#55d7de;--pink:#ff83b8;--green:#7be3a8;--orange:#ffc16d;--red:#ff6b6b;--yellow:#ffd93d;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}button,input{font:inherit;color:inherit}button{border:0;cursor:pointer}

.app{height:100vh;display:grid;grid-template-columns:72px 1fr;grid-template-rows:58px 1fr 40px}

/* Rail */
.rail{grid-row:1/4;background:#15161d;border-right:1px solid var(--line);display:flex;align-items:center;flex-direction:column;padding:15px 10px;gap:20px}
.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--purple),var(--cyan));display:grid;place-items:center;color:#111;font-weight:900;font-size:19px;box-shadow:0 0 22px #9b7cff55}
.rail button{width:42px;height:40px;background:transparent;color:#777d91;border-radius:11px;font-size:18px}
.rail button.active,.rail button:hover{background:#292536;color:#d6caff}
.rail .spacer{flex:1}

/* Topbar */
.topbar{background:#17181f;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:20px}
.crumb{display:flex;align-items:center;gap:10px;min-width:250px}
.crumb strong{font-size:15px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.top-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.btn{background:#242733;border:1px solid #343848;padding:8px 12px;border-radius:8px;color:#cdd1df;font-size:12px}
.btn:hover{background:#303443}
.btn.primary{background:linear-gradient(135deg,var(--purple2),#9b70f8);border:0;color:#fff}

/* Main mixer layout */
.mixer-main{display:grid;grid-template-rows:1fr auto;background:#101116;overflow:hidden}

/* Channel strips container */
.strips{display:flex;gap:0;overflow-x:auto;padding:0}
.strips::-webkit-scrollbar{height:6px}
.strips::-webkit-scrollbar-track{background:#1a1b22}
.strips::-webkit-scrollbar-thumb{background:#3a3d4a;border-radius:3px}

/* Individual channel strip */
.strip{min-width:120px;width:120px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:0;position:relative}
.strip.master{min-width:140px;width:140px;background:#1a1b24;border-left:2px solid var(--purple)}
.strip.master .strip-label{color:var(--purple);font-weight:700}

/* Strip header */
.strip-header{padding:10px 10px 6px;border-bottom:1px solid var(--line)}
.strip-label{font-size:11px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
.strip-color{width:100%;height:3px;border-radius:2px;margin-bottom:6px}

/* Mute/Solo buttons */
.ms-row{display:flex;gap:4px}
.ms-btn{flex:1;padding:3px 0;font-size:10px;font-weight:700;border-radius:4px;text-align:center;background:#252730;color:#555;transition:all .15s}
.ms-btn.mute-active{background:var(--red);color:#fff}
.ms-btn.solo-active{background:var(--yellow);color:#111}
.ms-btn:hover{background:#303443}

/* Fader section */
.fader-section{flex:1;display:flex;flex-direction:column;align-items:center;padding:12px 0 6px;position:relative}
.fader-label{font-size:10px;color:var(--muted);margin-bottom:6px}
.fader-track{width:4px;height:140px;background:#252730;border-radius:2px;position:relative;cursor:pointer}
.fader-fill{position:absolute;bottom:0;width:100%;border-radius:2px;transition:height .1s}
.fader-thumb{position:absolute;width:20px;height:8px;border-radius:3px;left:50%;transform:translateX(-50%);cursor:grab;box-shadow:0 1px 4px rgba(0,0,0,.4);transition:bottom .1s}
.fader-thumb:active{cursor:grabbing}
.fader-value{font-size:11px;font-weight:600;color:var(--text);margin-top:6px;font-variant-numeric:tabular-nums}

/* Pan knob */
.pan-section{padding:8px 0;display:flex;flex-direction:column;align-items:center;border-top:1px solid var(--line)}
.pan-label{font-size:9px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.pan-knob{width:36px;height:36px;border-radius:50%;background:conic-gradient(from 225deg, var(--cyan) 0deg, var(--cyan) var(--pan-angle, 0deg), #252730 var(--pan-angle, 0deg), #252730 270deg);position:relative;cursor:pointer;border:2px solid #2a2c36}
.pan-knob::after{content:'';position:absolute;top:50%;left:50%;width:2px;height:14px;background:var(--text);border-radius:1px;transform-origin:bottom center;transform:translate(-50%,-100%) rotate(var(--pan-rotate, 0deg))}
.pan-value{font-size:10px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}

/* EQ section */
.eq-section{padding:8px 10px;border-top:1px solid var(--line)}
.eq-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.eq-knobs{display:flex;justify-content:space-between;gap:2px}
.eq-knob-wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.eq-knob{width:28px;height:28px;border-radius:50%;background:conic-gradient(from 225deg, var(--green) 0deg, var(--green) var(--eq-angle, 135deg), #252730 var(--eq-angle, 135deg), #252730 270deg);position:relative;cursor:pointer;border:2px solid #2a2c36}
.eq-knob::after{content:'';position:absolute;top:50%;left:50%;width:2px;height:10px;background:var(--text);border-radius:1px;transform-origin:bottom center;transform:translate(-50%,-100%) rotate(var(--eq-rotate, 0deg))}
.eq-freq{font-size:8px;color:var(--muted)}

/* Compressor section */
.comp-section{padding:8px 10px;border-top:1px solid var(--line)}
.comp-meter{height:4px;background:#252730;border-radius:2px;margin-top:4px;overflow:hidden}
.comp-fill{height:100%;background:linear-gradient(90deg, var(--green), var(--yellow), var(--red));border-radius:2px;transition:width .1s}

/* Bottom transport */
.bottom{background:#17181f;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:16px}
.transport{display:flex;gap:4px}
.transport button{width:32px;height:28px;background:#242733;border-radius:6px;font-size:14px;color:var(--text)}
.transport button:hover{background:#303443}
.transport button.play{background:var(--purple2);color:#fff;width:36px}
.time{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter{width:80px;height:6px;background:#252730;border-radius:3px;overflow:hidden}
.meter-fill{height:100%;background:linear-gradient(90deg, var(--green), var(--yellow), var(--red));border-radius:3px;transition:width .1s}

/* Preset bar */
.preset-bar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--panel2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.preset-bar label{font-size:11px;color:var(--muted)}
.preset-bar select{background:#252730;border:1px solid var(--line);color:var(--text);padding:4px 8px;border-radius:4px;font-size:11px}
.preset-bar .btn{font-size:11px;padding:4px 10px}

/* Mobile */
@media(max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:58px 1fr 42px}
  .rail{position:fixed;z-index:20;bottom:0;left:0;right:0;height:58px;border-right:0;border-top:1px solid var(--line);flex-direction:row;padding:8px 14px;gap:8px}
  .rail .logo,.rail .spacer,.rail button[title="Help"]{display:none}
  .strip{min-width:90px;width:90px}
  .strip.master{min-width:100px;width:100px}
  .fader-track{height:100px}
  .eq-section,.comp-section{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="logo">L</div>
    <button title="Editor">◈</button>
    <button class="active" title="Mixer">⊞</button>
    <button title="Voicebanks">♬</button>
    <button title="Projects">▣</button>
    <div class="spacer"></div>
    <button title="Settings">⚙</button>
    <button title="Help">?</button>
  </aside>

  <header class="topbar">
    <div class="crumb">
      <span class="dot"></span>
      <strong>midnight_demo</strong>
      <span style="color:var(--muted)">/ Mixer</span>
    </div>
    <div class="top-actions">
      <button class="btn" id="resetBtn">↺ Reset</button>
      <button class="btn" id="soloClearBtn">Clear Solo</button>
      <button class="btn primary" id="exportBtn">Export audio</button>
    </div>
  </header>

  <main class="mixer-main">
    <!-- Preset bar -->
    <div class="preset-bar">
      <label>Preset:</label>
      <select id="presetSelect">
        <option>Default</option>
        <option>Vocal Bright</option>
        <option>Vocal Warm</option>
        <option>Mastering</option>
        <option>Custom</option>
      </select>
      <button class="btn" id="savePresetBtn">Save</button>
      <div style="flex:1"></div>
      <label style="font-size:10px;color:var(--muted)">FX Chain:</label>
      <button class="btn" id="eqToggle" style="font-size:10px">EQ ✓</button>
      <button class="btn" id="compToggle" style="font-size:10px">Comp ✓</button>
      <button class="btn" id="clipToggle" style="font-size:10px;color:var(--orange)">SoftClip ✓</button>
    </div>

    <!-- Channel strips -->
    <div class="strips" id="strips">
      <!-- Strips are generated by JS -->
    </div>

    <!-- Bottom transport -->
    <div class="bottom">
      <div class="transport">
        <button>⏮</button>
        <button class="play" id="play">▶</button>
        <button>⏭</button>
        <button>↻</button>
      </div>
      <div class="time" id="time">00:00.000 / 01:24.000</div>
      <div class="meter"><div class="meter-fill" id="meter" style="width:0%"></div></div>
      <div style="flex:1"></div>
      <div style="font-size:10px;color:var(--muted)">44.1 kHz · Mono · WORLD v2</div>
    </div>
  </main>
</div>

<script>
const tracks = [
  { name: 'Lead Vocal', color: '#a98cff', volume: 0, pan: 0, muted: false, solo: false, low: 0, mid: 0, high: 0 },
  { name: 'Harmony', color: '#55d7de', volume: -3, pan: 0.3, muted: false, solo: false, low: 0, mid: 0, high: 0 },
  { name: 'Guide', color: '#ff83b8', volume: -12, pan: 0, muted: true, solo: false, low: 0, mid: 0, high: 0 },
];
const master = { name: 'MASTER', color: '#a98cff', volume: -1, pan: 0, muted: false, solo: false, low: 0, mid: 0, high: 0 };

function dbText(db) {
  if (db === 0) return '0.0 dB';
  return (db > 0 ? '+' : '') + db.toFixed(1) + ' dB';
}

function panText(pan) {
  if (pan === 0) return 'C';
  return (pan > 0 ? 'R' : 'L') + ' ' + Math.abs(Math.round(pan * 100)) + '%';
}

function faderPercent(db) {
  // Map dB to fader position: -60dB = 0%, 0dB = 70%, +12dB = 100%
  const min = -60, max = 12;
  return Math.max(0, Math.min(100, ((db - min) / (max - min)) * 100));
}

function panAngle(pan) {
  // -1 = -135deg, 0 = 0deg, 1 = 135deg
  return pan * 135;
}

function eqAngle(db) {
  // Map -12..+12 dB to 0..270 degrees
  const clamped = Math.max(-12, Math.min(12, db));
  return ((clamped + 12) / 24) * 270;
}

function renderStrips() {
  const container = document.getElementById('strips');
  container.innerHTML = '';

  [...tracks, master].forEach((t, i) => {
    const isMaster = i === tracks.length;
    const strip = document.createElement('div');
    strip.className = 'strip' + (isMaster ? ' master' : '');

    const pct = faderPercent(t.volume);
    const faderColor = isMaster ? 'var(--purple)' : t.color;

    strip.innerHTML = `
      <div class="strip-header">
        <div class="strip-color" style="background:${t.color}"></div>
        <div class="strip-label">${t.name}</div>
        <div class="ms-row">
          <button class="ms-btn${t.muted ? ' mute-active' : ''}" data-action="mute" data-idx="${i}">M</button>
          <button class="ms-btn${t.solo ? ' solo-active' : ''}" data-action="solo" data-idx="${i}">S</button>
        </div>
      </div>

      <div class="fader-section">
        <div class="fader-label">VOLUME</div>
        <div class="fader-track" data-idx="${i}">
          <div class="fader-fill" style="height:${pct}%;background:${faderColor};opacity:0.3"></div>
          <div class="fader-thumb" style="bottom:calc(${pct}% - 4px);background:${faderColor}"></div>
        </div>
        <div class="fader-value">${dbText(t.volume)}</div>
      </div>

      <div class="pan-section">
        <div class="pan-label">PAN</div>
        <div class="pan-knob" data-idx="${i}" style="--pan-rotate:${panAngle(t.pan)}deg;--pan-angle:${(Math.abs(t.pan) * 135)}deg"></div>
        <div class="pan-value">${panText(t.pan)}</div>
      </div>

      ${!isMaster ? `
      <div class="eq-section">
        <div class="eq-label">EQ</div>
        <div class="eq-knobs">
          <div class="eq-knob-wrap">
            <div class="eq-knob" data-idx="${i}" data-band="low" style="--eq-angle:${eqAngle(t.low)}deg;--eq-rotate:${panAngle(t.low / 12)}deg"></div>
            <div class="eq-freq">LOW</div>
          </div>
          <div class="eq-knob-wrap">
            <div class="eq-knob" data-idx="${i}" data-band="mid" style="--eq-angle:${eqAngle(t.mid)}deg;--eq-rotate:${panAngle(t.mid / 12)}deg"></div>
            <div class="eq-freq">MID</div>
          </div>
          <div class="eq-knob-wrap">
            <div class="eq-knob" data-idx="${i}" data-band="high" style="--eq-angle:${eqAngle(t.high)}deg;--eq-rotate:${panAngle(t.high / 12)}deg"></div>
            <div class="eq-freq">HIGH</div>
          </div>
        </div>
      </div>
      <div class="comp-section">
        <div class="eq-label">COMPRESSOR</div>
        <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--muted)">
          <span>Thresh</span><span>-12 dB</span>
        </div>
        <div class="comp-meter"><div class="comp-fill" style="width:${30 + Math.random() * 40}%"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:4px">
          <span>Ratio</span><span>4:1</span>
        </div>
      </div>
      ` : `
      <div class="eq-section">
        <div class="eq-label">MASTER EQ</div>
        <div class="eq-knobs">
          <div class="eq-knob-wrap">
            <div class="eq-knob" data-idx="${i}" data-band="low" style="--eq-angle:${eqAngle(t.low)}deg;--eq-rotate:${panAngle(t.low / 12)}deg"></div>
            <div class="eq-freq">LOW</div>
          </div>
          <div class="eq-knob-wrap">
            <div class="eq-knob" data-idx="${i}" data-band="mid" style="--eq-angle:${eqAngle(t.mid)}deg;--eq-rotate:${panAngle(t.mid / 12)}deg"></div>
            <div class="eq-freq">MID</div>
          </div>
          <div class="eq-knob-wrap">
            <div class="eq-knob" data-idx="${i}" data-band="high" style="--eq-angle:${eqAngle(t.high)}deg;--eq-rotate:${panAngle(t.high / 12)}deg"></div>
            <div class="eq-freq">HIGH</div>
          </div>
        </div>
      </div>
      `}
    `;
    container.appendChild(strip);
  });

  // Attach mute/solo handlers
  document.querySelectorAll('.ms-btn').forEach(btn => {
    btn.onclick = () => {
      const idx = parseInt(btn.dataset.idx);
      const action = btn.dataset.action;
      const t = idx < tracks.length ? tracks[idx] : master;
      if (action === 'mute') t.muted = !t.muted;
      if (action === 'solo') t.solo = !t.solo;
      renderStrips();
    };
  });

  // Attach fader drag
  document.querySelectorAll('.fader-track').forEach(track => {
    let dragging = false;
    const idx = parseInt(track.dataset.idx);
    const updateFader = (e) => {
      const rect = track.getBoundingClientRect();
      const pct = Math.max(0, Math.min(100, ((rect.bottom - e.clientY) / rect.height) * 100));
      const db = -60 + (pct / 100) * 72;
      const t = idx < tracks.length ? tracks[idx] : master;
      t.volume = Math.round(db * 10) / 10;
      renderStrips();
    };
    track.onpointerdown = (e) => { dragging = true; track.setPointerCapture(e.pointerId); updateFader(e); };
    track.onpointermove = (e) => { if (dragging) updateFader(e); };
    track.onpointerup = () => { dragging = false; };
  });

  // Attach pan knob drag
  document.querySelectorAll('.pan-knob').forEach(knob => {
    let dragging = false;
    const idx = parseInt(knob.dataset.idx);
    const updatePan = (e) => {
      const rect = knob.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const angle = Math.atan2(e.clientY - cy, e.clientX - cx);
      const deg = (angle * 180 / Math.PI + 90 + 360) % 360;
      // Map angle to pan: top=0, right=+1, bottom=0, left=-1
      let pan;
      if (deg <= 180) pan = deg / 135;
      else pan = -(360 - deg) / 135;
      pan = Math.max(-1, Math.min(1, pan));
      const t = idx < tracks.length ? tracks[idx] : master;
      t.pan = Math.round(pan * 100) / 100;
      renderStrips();
    };
    knob.onpointerdown = (e) => { dragging = true; knob.setPointerCapture(e.pointerId); updatePan(e); };
    knob.onpointermove = (e) => { if (dragging) updatePan(e); };
    knob.onpointerup = () => { dragging = false; };
  });

  // Attach EQ knob drag
  document.querySelectorAll('.eq-knob').forEach(knob => {
    let dragging = false;
    const idx = parseInt(knob.dataset.idx);
    const band = knob.dataset.band;
    const updateEq = (e) => {
      const rect = knob.getBoundingClientRect();
      const cy = rect.top + rect.height / 2;
      const dy = cy - e.clientY;
      const t = idx < tracks.length ? tracks[idx] : master;
      // Map vertical drag to -12..+12 dB
      const db = Math.max(-12, Math.min(12, dy / 3));
      t[band] = Math.round(db * 10) / 10;
      renderStrips();
    };
    knob.onpointerdown = (e) => { dragging = true; knob.setPointerCapture(e.pointerId); updateEq(e); };
    knob.onpointermove = (e) => { if (dragging) updateEq(e); };
    knob.onpointerup = () => { dragging = false; };
  });
}

// Clear solo
document.getElementById('soloClearBtn').onclick = () => {
  tracks.forEach(t => t.solo = false);
  master.solo = false;
  renderStrips();
};

// Reset
document.getElementById('resetBtn').onclick = () => {
  tracks.forEach(t => { t.volume = 0; t.pan = 0; t.muted = false; t.solo = false; t.low = 0; t.mid = 0; t.high = 0; });
  master.volume = 0; master.pan = 0; master.low = 0; master.mid = 0; master.high = 0;
  renderStrips();
};

// Play animation
let playing = false;
document.getElementById('play').onclick = () => {
  playing = !playing;
  document.getElementById('play').textContent = playing ? '⏸' : '▶';
  if (playing) {
    let t = 0;
    window.timer = setInterval(() => {
      t += 0.1;
      document.getElementById('time').textContent = '00:' + String(Math.floor(t / 60)).padStart(2, '0') + '.' + String(Math.floor(t * 10) % 10) + '20 / 01:24.000';
      document.getElementById('meter').style.width = (35 + Math.random() * 38) + '%';
    }, 100);
  } else {
    clearInterval(window.timer);
  }
};

// FX toggles
['eqToggle', 'compToggle', 'clipToggle'].forEach(id => {
  document.getElementById(id).onclick = (e) => {
    e.target.style.opacity = e.target.style.opacity === '0.4' ? '1' : '0.4';
  };
});

renderStrips();
</script>
</body>
</html>
