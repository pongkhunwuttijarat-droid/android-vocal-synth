[package]
name = "ustx-codec"
version = "0.1.0"
edition = "2021"
description = "Rust .ustx codec as an engine plugin (.so) — mirror mixer-fx pattern"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
domain = { path = "../domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
