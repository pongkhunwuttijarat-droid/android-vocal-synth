[package]
name = "engine-wasm"
version.workspace = true
edition.workspace = true
description = "Browser (wasm32-unknown-unknown) entry point for the Rusted UTAU render engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Wave (audio) parts: the browser host has no filesystem, so it resolves
# `media_ref` through a `MemoryMediaSource` the page fills. Even with nothing
# registered the engine must go through the same path so an audio track is
# REPORTED as skipped instead of failing as "no voice part found".
media = { path = "../media" }
wasm-bindgen = "0.2"
js-sys = "0.3"
domain = { path = "../domain" }
serde_json = "1"
serde_yaml = "0.9"
# Rust owns the project document: edits go through reversible commands so
# undo/redo and the tick/rounding rules stay in one implementation.
commands = { path = "../commands" }
project-session = { path = "../project-session" }
voicebank = { path = "../voicebank" }
phonemizer = { path = "../phonemizer" }
feed = { path = "../feed" }
phrase = { path = "../phrase" }
runtime = { path = "../runtime", features = ["feed-integration"] }
wavwriter = { path = "../wavwriter" }
worldline-rs = { path = "../worldline-rs" }
world-rs = { path = "../world-rs" }
# Pure conversion code only (DEFAULT_FRAME_MS + build_requests) — no .so.
worldline-plugin = { path = "../worldline-plugin", default-features = false }
synth-cli = { path = "../../tools/synth-cli", default-features = false }

[dev-dependencies]
voicebank = { path = "../voicebank" }
serde_json = "1"
