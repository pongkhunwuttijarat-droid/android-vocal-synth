[package]
name = "diffsinger"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
feed = { path = "../feed" }
ort = { version = "2.0.0-rc.13", features = ["ndarray"] }
ndarray = "0.15"

# The NNAPI EP (Android GPU/NPU) has prebuilts ONLY for Android — the
# feature must not leak into the host build (ort-sys fails the download).
[target.'cfg(target_os = "android")'.dependencies]
ort = { version = "2.0.0-rc.13", features = ["ndarray", "nnapi"] }
